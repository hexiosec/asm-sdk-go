        This endpoint requires that the associated organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: getActions
      parameters:
      - description: Scan ID
        explode: true
        in: query
        name: scan_id
        required: false
        schema:
          type: string
        style: form
      - description: Scan Group ID (required if Scan ID is not provided)
        explode: true
        in: query
        name: scan_group_id
        required: false
        schema:
          type: string
        style: form
      - description: Maximum number of entries to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: number
        style: form
      - description: Offset into the list of entries to return
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: number
        style: form
      - description: Column to order results by
        explode: true
        in: query
        name: order
        required: false
        schema:
          enum:
          - created
          - modified
          type: string
        style: form
      - description: Sort direction
        explode: true
        in: query
        name: dir
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: |
          Fields to expand with additional information:

          * `links` - Expand instances of the risks under this action. DEPRECATED
          * `link_ids` - Same as `links` except only the IDs are returned. DEPRECATED
          * `link_from` - Node where the risk was found (requires `links` to be expanded). DEPRECATED
          * `link_to` - Node which represents the risk (requires `links` to be expanded). DEPRECATED
          * `target` - Node which carries this action. DEPRECATED
          * `assignee_user` - User to whom this action is assigned
          * `modified_by` - User to last update this action
          * `note_modified_by` - User to last update the note against this action
        explode: true
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - links
            - link_ids
            - link_from
            - link_to
            - target
            - assignee_user
            - modified_by
            - note_modified_by
            type: string
          type: array
        style: form
      - deprecated: true
        description: "If set, return actions with out_of_scope set to false DEPRECATED\
          \ - Use include_secondary"
        explode: true
        in: query
        name: include_out_of_scope
        required: false
        schema:
          type: boolean
        style: form
      - description: "If set, returns primary and secondary actions"
        explode: true
        in: query
        name: include_secondary
        required: false
        schema:
          type: boolean
        style: form
      - description: Language of text
        explode: true
        in: query
        name: lang
        required: false
        schema:
          enum:
          - en_gb
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ActionResponse"
                type: array
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
