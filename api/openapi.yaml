      - description: |
          Fields to expand with additional information:

          * `links` - Expand instances of the risks under this action. DEPRECATED
          * `link_ids` - Same as `links` except only the IDs are returned. DEPRECATED
          * `link_from` - Node where the risk was found (requires `links` to be expanded). DEPRECATED
          * `link_to` - Node which represents the risk (requires `links` to be expanded). DEPRECATED
          * `target` - Node which carries this action. DEPRECATED
          * `assignee_user` - User to whom this action is assigned
          * `modified_by` - User to last update this action
          * `note_modified_by` - User to last update the note against this action
        explode: true
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - links
            - link_ids
            - link_from
            - link_to
            - target
            - assignee_user
            - modified_by
            - note_modified_by
            type: string
          type: array
          default: null
