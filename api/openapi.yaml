      parameters:
      - description: Organisation ID
        explode: true
        in: query
        name: organisation_id
        required: true
        schema:
          type: string
        style: form
      - description: Maximum number of entries to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 1000
          maximum: 1000
          minimum: 1
          type: number
        style: form
      - description: Offset into the list of entries to return
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: number
        style: form
      - description: Column to order results by
        explode: true
        in: query
        name: order
        required: false
        schema:
          default: created
          enum:
          - name
          - group
          - type
          - status
          - size
          - created
          - last_ran
          - created_by
          type: string
        style: form
      - description: Sort direction
        explode: true
        in: query
        name: dir
        required: false
        schema:
          default: asc
