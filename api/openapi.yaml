  /v1/scan_data/{scan_id}/link_changes:
    get:
      description: "Required role: `scans:read`\n\nThis endpoint requires that the\
        \ associated organisation has API access enabled.\nIf API access is not allowed,\
        \ the response code will be 403 (Forbidden).\n\nThe Link Changes endpoint\
        \ returns the same information shown on the **Changes** page in the Hexiosec\
        \ ASM app — for example, when a new risk is detected on a service or when\
        \ a domain starts pointing to a new IP.  \n\nFor counts of new and removed\
        \ assets per iteration, see the `/v1/scans/{id}/iterations` endpoint.  \n\n\
        Read the full user guide for examples and best practices: [docs.hexiosec.com/asm/link-changes-endpoint](https://docs.hexiosec.com/asm/link-changes-endpoint)\
        \  \n"
      operationId: getScanDataLinkChanges
      parameters:
      - description: Scan ID
        explode: false
        in: path
        name: scan_id
        required: true
        schema:
          type: string
        style: simple
      - description: Filter by link type
        explode: true
        in: query
        name: link_type
        required: false
        schema:
          items:
            enum:
            - ASSIGNED
            - CHILD
            - CLOUD
            - DNS_A
            - DNS_AAAA
            - DNS_CNAME
            - DNS_MX_DOMAIN
            - DNS_MX_IP
            - DNS_NS
            - DNS_PTR
            - HOSTS
            - HOSTS_CERTIFICATE
            - RISK
            - LOCATED
            - LINKS
            - PROVIDES
            - REDIRECT
            - REFERENCED
            - REFERS
            - ROUTED
            - SEED
            - SPF_IP
            - SPF_DOMAIN
            - SPF_RANGE
            - SPF_REDIRECT
            - SUBSET
            - USES_ASSET
            - USES_CERTIFICATE
            - USES_CLOUD_ASSET
            - USES_COMPONENT
            - WITHIN
            type: string
          type: array
          default: null
        style: form
      - description: Filter by from node type
        explode: true
        in: query
        name: from_type
        required: false
        schema:
          items:
            enum:
            - Scan
            - IPv4
            - IPv6
            - IPRange
            - Domain
            - Country
            - Service
            - Risk
            - Certificate
            - Component
            - Registrant
            - URL
            - Entity
            - CloudRegion
            - CloudAsset
            - ASN
            - Asset
            type: string
          type: array
          default: null
        style: form
      - description: Filter by to node type
        explode: true
        in: query
        name: to_type
        required: false
        schema:
          items:
            enum:
            - Scan
            - IPv4
            - IPv6
            - IPRange
            - Domain
            - Country
            - Service
            - Risk
            - Certificate
            - Component
            - Registrant
            - URL
            - Entity
            - CloudRegion
            - CloudAsset
            - ASN
            - Asset
            type: string
          type: array
          default: null
        style: form
      - description: Filter by risk severity
        explode: true
        in: query
        name: risk_severity_number
        required: false
        schema:
          items:
            maximum: 4
            minimum: 0
            type: integer
          type: array
          default: null
        style: form
      - description: Include transient link changes. A transient link is one that
          was added and then removed within the timeframe of the changes.
        explode: true
        in: query
        name: include_transient
        required: false
        schema:
          type: boolean
        style: form
      - description: From iteration ID (uuid)
        explode: true
        in: query
        name: from_iteration
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: To iteration ID (uuid)
        explode: true
        in: query
        name: to_iteration
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: Number of last iterations to compare
        explode: true
        in: query
        name: last_iterations
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      - description: Language of text
        explode: true
        in: query
        name: lang
        required: false
        schema:
          enum:
          - en_gb
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanDataLinkChangesResponse"
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request was valid but did not find a result. The scan could
            be in progress or the scan ID is invalid.
      security:
      - APIKey: []
      summary: Get link changes by Scan ID and iteration(s)
      tags:
      - scan_data
  /v1/graph/nodes/bulk/{scan_id}:
    patch:
      description: |
        Required role: `scans:write`

        This endpoint allows you to update multiple nodes for a scan in one request by:
          - marking nodes as secondary/primary assets
          - adding tags to nodes
          - removing tags from nodes

        **Note:**
          - Only **Domain**, **IPv4** or **IPv6** nodes can be bulk updated.
          - If `mark_as_secondary` is set and `node_ids` contains a seed node, the request is rejected. Seed nodes can still be used with `add_tags` and `remove_tags`.
          - A maximum of **50** node IDs can be updated per request.
          - Node IDs that do not exist, or do not belong to the scan, cause the request to fail.
          - Tag operations require the organisation tier tags feature.
          - `mark_as_secondary`, `add_tags`, and `remove_tags` are all optional. If omitted, the request is treated as a no-op and returns `204`.

        This endpoint requires that the associated organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: bulkUpdateNodesByScanId
      parameters:
      - description: Scan ID
        explode: false
        in: path
        name: scan_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateNodesRequest"
        description: Parameters to update nodes in bulk
        required: true
      responses:
        "204":
          description: Nodes updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Bulk update nodes
      tags:
      - graph
  /v1/graph/nodes/{id}:
    patch:
      description: "Required role: `scans:write`\n\nThis endpoint allows you to set\
        \ a node as a primary or secondary asset, and ignore IPs.\n\nIgnoring IPs\
        \ can be used to mark CDN hosted domains and hide IP risks (mark IPs as secondary\
        \ assets) linked to these domains.\n\n**Note:** \n  - Only **Domain**, **IPv4**\
        \ or **IPv6** nodes can be marked as secondary assets. \n  - Only **Domain**\
        \ nodes can be marked to ignore IPs, and the associated organisation must\
        \ have this feature enabled.\n  - You can not use both the deprecated *remove_from_scope*\
        \ and the *mark_as_secondary* parameters, use one or the other.\n\nThis endpoint\
        \ requires that the associated organisation has API access enabled.\nIf API\
        \ access is not allowed, the response code will be 403 (Forbidden).\n"
      operationId: updateNodeById
      parameters:
      - description: Node ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeRequest"
        description: Parameters to update the node
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericGraphNode"
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Update a node by ID
      tags:
      - graph
  /v1/reports:
    post:
      description: "Required role: `scans.reports:write` for single-scan reports.\
        \ Multi-scan reports require `scans.reports:read` for every scan in `scan_ids`.\n\
        \nReport generation is an asynchronous operation. The response will contain\
        \ the report ID and the report will be generated in the background.\nYou can\
        \ use the report ID to check the state of the report. The \"state\" property\
        \ will be set to \"done\" when the report is ready for download.\n\n\nThis\
        \ endpoint requires that the associated organisation has API access enabled.\
