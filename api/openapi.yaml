components:
  responses:
    CountResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object"
      description: Valid count response
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Request did not match expected format or failed validation
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Authorisation failed or was not provided
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Authorisation was successful but the operation was not allowed
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Request was valid but did not find a result
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Request was valid but could not be completed due to a conflict
    Error:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: An error occurred processing the request
  schemas:
    AuthResponse:
      example:
        authenticated: true
        scheme: session
        groups:
        - groups
        - groups
        roles:
        - files:list
        - files:create
        csrf: session
        attributes: "{}"
        user:
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          email: email
          name: name
          family_name: family_name
          given_name: given_name
          last_ip: last_ip
          created: 2000-01-23T04:56:07.000+00:00
          updated: 2000-01-23T04:56:07.000+00:00
          sso_subject: sso_subject
          attributes: "{}"
          enabled: true
          default_organisation_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          totp_enabled: true
      properties:
        authenticated:
          description: True if the chosen authentication scheme has passed.
          example: true
          type: boolean
        scheme:
          description: Name of the authentication scheme used.
          example: session
          type: string
        groups:
          description: List of groups for which the current user is a member.
          items:
            type: string
          type: array
          default: null
        roles:
          description: List of roles granted to the current user
          example:
          - files:list
          - files:create
          items:
            type: string
          type: array
          default: null
        csrf:
          description: CSRF token to use with POST/PUT/PATCH/DELETE requests which
            use session authentication.
          example: session
          type: string
        attributes:
          description: Combined attributes for the current user.
          type: object
        user:
          $ref: "#/components/schemas/UserRowResponse"
      required:
      - authenticated
    OrganisationResponse:
      example:
        id: id
        name: name
        tier: tier
        attributes: "{}"
        owner_id: owner_id
        email_suffixes:
        - email_suffixes
        - email_suffixes
        deleted: true
        created: 2000-01-23T04:56:07.000+00:00
        created_by: created_by
        updated: 2000-01-23T04:56:07.000+00:00
        updated_by: updated_by
        roles:
        - roles
        - roles
        groups:
        - groups
        - groups
        owner_user:
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          given_name: given_name
          family_name: family_name
          email: email
