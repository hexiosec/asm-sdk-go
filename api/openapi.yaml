paths:
  /auth:
    get:
      operationId: getState
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Valid response
      security:
      - {}
      - APIKey: []
      summary: Get the auth state and associated user for the request
      tags:
      - auth
  /v1/orgs:
    get:
      description: "Required role: `organisations:read`\n\nThis endpoint only returns\
        \ entries for which API access is enabled.\nIn the event the user is not a\
        \ member of any organisation with API access, an empty array will be returned.\
        \ \n"
      operationId: getOrganisations
      parameters:
      - description: Maximum number of entries to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: number
        style: form
      - description: Offset into the list of entries to return
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: number
        style: form
      - description: Column to order results by
        explode: true
        in: query
        name: order
        required: false
        schema:
          enum:
          - created
          - updated
          type: string
        style: form
      - description: Sort direction
        explode: true
        in: query
        name: dir
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Included deleted entries in results
        explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      - description: Fields to expand with additional information
        explode: true
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - roles
            - groups
            - owner
            - created_by
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/OrganisationResponse"
                type: array
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
      security:
      - APIKey: []
      summary: Get the organisations for which the current user is a member
      tags:
      - organisations
  /v1/orgs/{id}:
    get:
      description: |
        Required role: `organisations:read`

        This endpoint requires that the organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: getOrganisationByID
      parameters:
      - description: Organisation ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Fields to expand with additional information
        explode: true
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - roles
            - groups
            - owner
            - created_by
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Get an organisation by ID
      tags:
      - organisations
  /v1/orgs/{id}/asset/{key}:
