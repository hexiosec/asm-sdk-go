paths:
  /auth:
    get:
      operationId: getState
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Valid response
      security:
      - {}
      - APIKey: []
      summary: Get the auth state and associated user for the request
      tags:
      - auth
  /v1/orgs:
    get:
      description: "Required role: `organisations:read`\n\nThis endpoint only returns\
        \ entries for which API access is enabled.\nIn the event the user is not a\
        \ member of any organisation with API access, an empty array will be returned.\
        \ \n"
      operationId: getOrganisations
      parameters:
      - description: Maximum number of entries to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: number
        style: form
      - description: Offset into the list of entries to return
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: number
        style: form
      - description: Column to order results by
        explode: true
        in: query
        name: order
        required: false
        schema:
          enum:
          - created
          - updated
          type: string
        style: form
      - description: Sort direction
        explode: true
        in: query
        name: dir
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Included deleted entries in results
        explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      - description: Fields to expand with additional information
        explode: true
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - roles
            - groups
            - owner
            - created_by
            type: string
          type: array
          default: null
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/OrganisationResponse"
                type: array
                default: null
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
      security:
      - APIKey: []
      summary: Get the organisations for which the current user is a member
      tags:
      - organisations
  /v1/orgs/{id}:
    get:
      description: |
        Required role: `organisations:read`

        This endpoint requires that the organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: getOrganisationByID
      parameters:
      - description: Organisation ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Fields to expand with additional information
        explode: true
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - roles
            - groups
            - owner
            - created_by
            type: string
          type: array
          default: null
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Get an organisation by ID
      tags:
      - organisations
  /v1/orgs/{id}/asset/{key}:
    delete:
      description: |
        Required role: `organisations:write`

        This endpoint requires that the organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: deleteOrganisationAsset
      parameters:
      - description: Organisation ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Asset key
        explode: false
        in: path
        name: key
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Delete an organisation asset
      tags:
      - organisations
    get:
      description: |
        Required role: `organisations:read`

        This endpoint requires that the organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: getOrganisationAsset
      parameters:
      - description: Organisation ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Asset key
        explode: false
        in: path
        name: key
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationAssetResponse"
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Get an organisation asset by key
      tags:
      - organisations
  /organisations/join_free_org:
    post:
      description: |
        Required role: `organisations:create`

        This endpoint auto-joins the requesting user to a single eligible free-tier organisation based on email domain and returns the most recent continuous scan.
      operationId: joinFreeOrganisation
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/joinFreeOrganisation_200_response"
          description: Valid response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/joinFreeOrganisation_400_response"
          description: Join request failed
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - APIKey: []
      summary: Join an existing free organisation and return its current continuous
        scan
      tags:
      - organisations
  /v1/scan_groups:
    get:
      description: |
        Required role: `scan_groups:read`

        This endpoint requires that the organisation of which the scan group is part of has API access enabled.
        If API access is not allowed, the request will succeed but return an empty array.
      operationId: getScanGroups
      parameters:
      - description: Organisation ID
        explode: true
        in: query
        name: organisation_id
        required: true
        schema:
          type: string
        style: form
      - description: Maximum number of entries to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: number
        style: form
      - description: Offset into the list of entries to return
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: number
        style: form
      - description: Column to order results by
        explode: true
        in: query
        name: order
        required: false
        schema:
          enum:
          - created
          - updated
          type: string
        style: form
      - description: Sort direction
        explode: true
        in: query
        name: dir
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Included deleted entries in results
        explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      - description: Fields to expand with additional information
        explode: true
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - roles
            - groups
            - updated_by
            - created_by
            type: string
          type: array
          default: null
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ScanGroupResponse"
                type: array
                default: null
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Get the Scan Groups for a specified organisation
      tags:
      - scan_groups
    post:
      description: |
        Required role: `scan_groups:create`
      operationId: createScanGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanGroupCreateRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanGroupResponse"
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Create a new scan group
      tags:
      - scan_groups
  /v1/scan_groups/{id}:
    delete:
      description: |
        Required role: `scan_groups:manage`

        This endpoint requires that the associated organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: deleteScanGroupByID
      parameters:
      - description: Scan Group ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Delete a scan group by ID
      tags:
      - scan_groups
    get:
      description: |
        Required role: `scan_groups:read`

        This endpoint requires that the associated organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: getScanGroupByID
      parameters:
      - description: Scan Group ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Fields to expand with additional information
        explode: true
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - organisation
            - roles
            - groups
            - updated_by
            - created_by
            type: string
          type: array
          default: null
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanGroupResponse"
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Get a scan group by ID
      tags:
      - scan_groups
    patch:
      description: |
        Required role: `scan_groups:write`

        This endpoint requires that the associated organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: updateScanGroupByID
      parameters:
      - description: Scan Group ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanGroupUpdateRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanGroupResponse"
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - APIKey: []
      summary: Update a scan group by ID
      tags:
      - scan_groups
  /v1/scans:
    get:
      description: |
        Required role: `scans:read`

        This endpoint requires that the associated organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: getScans
      parameters:
      - description: Scan Group ID
        explode: true
        in: query
        name: scan_group_id
        required: true
        schema:
          type: string
        style: form
      - description: Filter by scan types
        explode: true
        in: query
        name: type
        required: true
        schema:
          items:
            enum:
            - adhoc
            - continuous_own
            - continuous_vendor
            type: string
          type: array
          default: null
        style: form
      - description: Maximum number of entries to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: number
        style: form
      - description: Offset into the list of entries to return
        explode: true
        in: query
        name: offset
        required: false
        schema:
          type: number
        style: form
      - description: Column to order results by
        explode: true
        in: query
        name: order
        required: false
        schema:
          enum:
          - created
          - updated
          - name
          type: string
        style: form
      - description: Sort direction
        explode: true
        in: query
        name: dir
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Fields to expand with additional information
        explode: true
        in: query
        name: expand
        required: false
        schema:
          items:
            enum:
            - node
            - iteration
            - iteration_errors
            - created_by
            - tags
            type: string
          type: array
          default: null
        style: form
      - description: Search string
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Include seeds in text search
        explode: true
        in: query
        name: search_seeds
        required: false
        schema:
          type: boolean
        style: form
      - description: Filter scans by tag names
        explode: true
        in: query
        name: tags
        required: false
        schema:
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 50
          type: array
          uniqueItems: true
          default: null
        style: form
      - description: Include disabled scans
        explode: true
        in: query
        name: include_disabled
        required: false
        schema:
          type: boolean
        style: form
      - description: Include deleted scans
        explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ScanResponse"
                type: array
                default: null
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - APIKey: []
      summary: Get the Scans for a specified scan group
      tags:
      - scans
    post:
      description: "Required role: `scans:manage`\n\nStep 1 of 3 in creating a scan.\
        \ [Step 2](#post-/v1/scans/-id-/seeds). [Step 3](#patch-/v1/scans/-id-)\n\n\
        This endpoint requires that the associated organisation has API access enabled.\
        \ \nIf API access is not allowed, the response code will be 403 (Forbidden).\n\
        A calendar schedule can only be provided if the associated organisation and\
        \ scan type has this feature enabled.\nThe endpoint is subject to usage restrictions\
        \ based on the associated organisation's plan, to find out more see the [Scan\
        \ Allowance documentation](https://docs.hexiosec.com/asm/scan-allowances)\n"
      operationId: createScan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanRequest"
        description: Parameters to create the new scan
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - APIKey: []
      summary: Create a scan
      tags:
      - scans
  /v1/scans/count:
    get:
      description: |
        Required role: `scans:read`

        This endpoint requires that the associated organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: getScansCount
      parameters:
      - description: Scan Group ID
        explode: true
        in: query
        name: scan_group_id
        required: true
        schema:
          type: string
        style: form
      - description: Filter by scan types
        explode: true
        in: query
        name: type
        required: true
        schema:
          items:
            enum:
            - adhoc
            - continuous_own
            - continuous_vendor
            type: string
          type: array
          default: null
        style: form
      - description: Search string
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Include seeds in text search
        explode: true
        in: query
        name: search_seeds
        required: false
        schema:
          type: boolean
        style: form
      - description: Filter scans by tag names
        explode: true
        in: query
        name: tags
        required: false
        schema:
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 50
          type: array
          uniqueItems: true
          default: null
        style: form
      - description: Include disabled scans
        explode: true
        in: query
        name: include_disabled
        required: false
        schema:
          type: boolean
        style: form
      - description: Include deleted scans
        explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          $ref: "#/components/responses/CountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - APIKey: []
      summary: Get the count of Scans for a specified scan group according to the
        filter settings
      tags:
      - scans
  /v1/scans/dashboard/metrics:
    post:
      description: |
        Required role: `scans:read`

        Returns time series metric rows for the specified scans.
        The caller must have access to every scan in `scan_ids`.
      operationId: getDashboardMetrics
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetDashboardMetricsRequest"
        description: Parameters to fetch dashboard metric rows
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ScanIterationMetricResponse"
                type: array
                default: null
          description: Valid response
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - APIKey: []
      summary: Get dashboard metric time series for accessible scans
      tags:
      - scans
  /v1/scans/by-org:
    get:
      description: |
        Required role:
        - `organisations:read` when `scope=member`
        - `organisations.scans:read` when `scope=organisation`

        This endpoint retrieves scans across all scan groups for a given organisation with server-side pagination and sorting.
        `scope=member` limits results to scans in scan groups the user is a member of.
        `scope=organisation` returns all scans in the organisation.
        This endpoint requires that the associated organisation has API access enabled.
        If API access is not allowed, the response code will be 403 (Forbidden).
      operationId: getScansForOrg
      parameters:
      - description: Organisation ID
        explode: true
        in: query
        name: organisation_id
        required: true
        schema:
          type: string
        style: form
      - description: Include accessible supplier scans in organisation results
        explode: true
        in: query
        name: include_supplier_scans
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Scope of scans to return
        explode: true
        in: query
        name: scope
        required: false
        schema:
          default: member
          enum:
          - member
          - organisation
          type: string
        style: form
      - description: Maximum number of entries to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 1000
          maximum: 1000
          minimum: 1
          type: number
        style: form
      - description: Offset into the list of entries to return
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: number
        style: form
      - description: Column to order results by
        explode: true
        in: query
        name: order
        required: false
        schema:
          default: created
          enum:
          - name
          - group
          - type
          - status
          - size
          - created
          - last_ran
          - created_by
          type: string
        style: form
      - description: Sort direction
        explode: true
        in: query
        name: dir
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Filter by scan types
        explode: true
        in: query
        name: type
        required: false
        schema:
          items:
            enum:
            - adhoc
            - continuous_own
            - continuous_vendor
            type: string
          type: array
          default: null
        style: form
      - description: Filter scans by tag names
        explode: true
        in: query
        name: tags
        required: false
        schema:
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 50
          type: array
          uniqueItems: true
          default: null
        style: form
      - description: Search scan names or seed names
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Include seed names in search
