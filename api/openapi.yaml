  name: scan_groups
- description: Supply chain risk management endpoints
  name: suppliers
- description: Scan endpoints
  name: scans
- description: Tag endpoints
  name: tags
- description: Graph endpoints
  name: graph
- description: Discovery data endpoints
  name: scan_data
- description: Scan iteration endpoints
  name: iterations
- description: Actions endpoints
  name: actions
