components:
  responses:
    CountResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object"
      description: Valid count response
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Request did not match expected format or failed validation
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Authorisation failed or was not provided
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Authorisation was successful but the operation was not allowed
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Request was valid but did not find a result
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Request was valid but could not be completed due to a conflict
    Error:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: An error occurred processing the request
  schemas:
    AuthResponse:
      example:
        authenticated: true
        scheme: session
        roles:
        - files:list
        - files:create
        groups:
        - groups
        - groups
        csrf: session
        attributes: "{}"
        user:
          last_ip: last_ip
          created: 2000-01-23T04:56:07.000+00:00
          totp_enabled: true
          given_name: given_name
          enabled: true
          name: name
          attributes: "{}"
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          sso_subject: sso_subject
          family_name: family_name
          updated: 2000-01-23T04:56:07.000+00:00
          email: email
          default_organisation_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        authenticated:
          description: True if the chosen authentication scheme has passed.
          example: true
          type: boolean
        scheme:
          description: Name of the authentication scheme used.
          example: session
          type: string
        groups:
          description: List of groups for which the current user is a member.
          items:
            type: string
          type: array
        roles:
          description: List of roles granted to the current user
          example:
          - files:list
          - files:create
          items:
            type: string
          type: array
        csrf:
          description: CSRF token to use with POST/PUT/PATCH/DELETE requests which
            use session authentication.
          example: session
          type: string
        attributes:
          description: Combined attributes for the current user.
          type: object
        user:
          $ref: "#/components/schemas/UserRowResponse"
      required:
      - authenticated
    OrganisationResponse:
      example:
        owner_id: owner_id
        created: 2000-01-23T04:56:07.000+00:00
        email_suffixes:
        - email_suffixes
        - email_suffixes
        roles:
        - roles
        - roles
        groups:
        - groups
        - groups
        created_by: created_by
        owner_user:
          name: name
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          given_name: given_name
          family_name: family_name
          email: email
        created_by_user:
          name: name
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          given_name: given_name
          family_name: family_name
          email: email
        deleted: true
        tier: tier
        name: name
        updated_by: updated_by
        attributes: "{}"
        id: id
        updated: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          description: Organisation ID
          type: string
        name:
          description: Organisation Name
          type: string
        tier:
          description: Organisation tier
          type: string
        attributes:
          description: Configuration attributes for the organisation
          type: object
        owner_id:
          description: User ID of the organisation owner
          type: string
        email_suffixes:
          description: Email suffixes for the organisation
          items:
            type: string
          type: array
        deleted:
          description: True if the organisation has been marked as deleted
          type: boolean
        created:
          description: Timestamp at which the entry was created
          format: date-time
          type: string
        created_by:
          description: User ID of the creator user
          type: string
        updated:
          description: Timestamp at which the entry was last updated
          format: date-time
          type: string
        updated_by:
          description: User ID of the last user to update this entry
          type: string
        roles:
          description: Roles granted to the current user for this organisation if
            requested
          items:
            description: Role name
            type: string
          type: array
        groups:
          description: Groups assigned to the current user for this organisation if
            requested
          items:
            description: Group name
            type: string
          type: array
        owner_user:
          $ref: "#/components/schemas/UserDetailsResponse"
        created_by_user:
          $ref: "#/components/schemas/UserDetailsResponse"
      required:
      - attributes
      - created
      - created_by
      - deleted
      - id
      - name
      - owner_id
      - tier
      - updated
